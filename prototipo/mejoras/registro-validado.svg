<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#18324b" flood-opacity=".08"/></filter>
  <style>
    .ui{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.muted{fill:#708196}.small{font-size:15px}.label{font-size:16px;font-weight:700}.body{font-size:18px}.title{font-size:30px;font-weight:700}.field{font-size:18px}.nav{font-size:18px}.green{fill:#237b63}.red{fill:#b83238}
  </style>
</defs>
<rect width="1440" height="900" fill="#f3f6fa"/>
<rect width="1440" height="88" fill="#fff"/>
